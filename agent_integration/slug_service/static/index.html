<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UCSC Slug Advisor</title>
<style>
  :root { --gold:#fdc700; --blue:#003c6c; --bg:#f6f7f9; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:#1a1a1a; }
  header { background:var(--blue); color:#fff; padding:14px 18px; font-weight:600; font-size:18px; }
  header span { color:var(--gold); }
  #chat { max-width:760px; margin:0 auto; padding:18px; }
  .msg { margin:14px 0; }
  .user { text-align:right; }
  .user .bubble { background:var(--blue); color:#fff; }
  .bot .bubble { background:#fff; border:1px solid #e3e6ea; }
  .bubble { display:inline-block; padding:10px 14px; border-radius:12px; max-width:90%;
            white-space:pre-wrap; line-height:1.45; text-align:left; }
  .trace { margin-top:8px; font-size:12px; color:#5a6b7b; }
  .trace summary { cursor:pointer; color:#8a98a6; user-select:none; list-style:none; }
  .trace summary::-webkit-details-marker { display:none; }
  .trace summary:hover { color:var(--blue); }
  .trace[open] summary { margin-bottom:6px; }
  .trace-body { padding-left:2px; line-height:1.7; }
  .trace code { background:#eef1f4; padding:1px 5px; border-radius:4px; }
  .hint { color:#7a8896; font-size:13px; }
  form { max-width:760px; margin:0 auto; padding:0 18px 24px; display:flex; gap:8px; }
  input { flex:1; padding:12px 14px; border:1px solid #cfd6dd; border-radius:10px; font-size:15px; }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--gold);
           color:var(--blue); font-weight:700; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
<header>🍌 UCSC <span>Slug Advisor</span> — ask about CSE courses, prerequisites, schedules, and dates</header>
<div id="chat">
  <div class="msg bot"><div class="bubble">Hi! I'm Slug Advisor. Try:
• What are the prerequisites for CSE 142?
• Is CSE 101 offered in winter, and what time?
• I want to learn machine learning — which course should I take?</div></div>
</div>
<form id="f">
  <input id="q" autocomplete="off" placeholder="Ask about UCSC CSE courses…" />
  <button id="send" type="submit">Send</button>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const input = document.getElementById('q');
const send = document.getElementById('send');

function add(role, html) {
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  m.innerHTML = '<div class="bubble">' + html + '</div>';
  chat.appendChild(m);
  window.scrollTo(0, document.body.scrollHeight);
  return m;
}
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  add('user', esc(question));
  input.value = '';
  send.disabled = true;
  const pending = add('bot', '<span class="hint">Thinking…</span>');
  try {
    const r = await fetch('/advisor', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question})
    });
    const data = await r.json();
    if (!r.ok) {
      pending.querySelector('.bubble').innerHTML =
        '<span class="hint">' + esc(data.detail || 'Something went wrong. Please try again.') + '</span>';
      send.disabled = false; input.focus(); return;
    }
    let html = esc(data.answer || '(no answer)');
    if (data.trace && data.trace.length) {
      const n = data.trace.length;
      const tools = data.trace.map(t =>
        '🔧 <code>' + esc(t.tool) + '(' + esc(JSON.stringify(t.args)) + ')</code>').join('<br>');
      html += '<details class="trace"><summary>🔧 ' + n + ' tool call' + (n > 1 ? 's' : '') +
              ' · show reasoning</summary><div class="trace-body">' + tools + '</div></details>';
    }
    pending.querySelector('.bubble').innerHTML = html;
  } catch (err) {
    pending.querySelector('.bubble').innerHTML =
      '<span class="hint">Something went wrong. Please try again.</span>';
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
